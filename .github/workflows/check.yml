name: Surf check
on:
  # schedule uitgeschakeld: de Cloudflare Worker doet nu de checks
  workflow_dispatch:
permissions: {contents: write}
concurrency: surf-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python checker.py
        env: {PAGES_URL: "https://martijnonthemove.github.io/surf-zeeland/"}
      - name: Bewaar verzonden meldingen
        run: |
          git config user.name "surf-bot"; git config user.email "surf-bot@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "state: meldingen bijgewerkt" && git push)
